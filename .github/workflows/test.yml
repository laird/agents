name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # No `cache: pip` — it needs a requirements.txt/pyproject.toml to hash,
          # and this repo has neither (the suite is stdlib-only). With nothing to
          # hash the cache step errors out and the job dies before pytest runs.
          # Add a manifest first if pip caching is ever wanted.
      - name: Install pytest
        run: python3 -m pip install --upgrade pip pytest
      - name: Run tests
        run: python3 -m pytest tests/ -v

  # pytest's default collection is `test_*.py`, so the 13 tests/test_*.sh files
  # were invisible to CI — which is how #57, #58 and #63 all shipped green.
  # They cover the issue-backend dispatcher, both backends, worker launch and
  # the fix-loop idle path, i.e. most of the autocoder runtime.
  #
  # Kept as a separate job so a shell failure and a python failure stay
  # distinguishable at a glance.
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The suite needs a committer identity: three tests build git fixtures
      # that commit, and a bare runner has no global user.name/user.email.
      # Each of those tests sets its own repo-local config, but this guards
      # any future test that forgets to.
      - name: Configure git identity
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
      # Output conventions differ across these files — 6 print a
      # "Results: N passed, M failed" summary, 7 print a terse "ok <name>".
      # Exit status is the one contract all 13 honour, so key on that and
      # never parse stdout.
      - name: Run shell tests
        run: |
          set -u
          failed=()
          for t in tests/test_*.sh; do
            echo "::group::$t"
            if bash "$t"; then
              echo "PASS $t"
            else
              rc=$?
              echo "FAIL $t (exit $rc)"
              failed+=("$t (exit $rc)")
            fi
            echo "::endgroup::"
          done
          echo ""
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "Failing shell tests (${#failed[@]}):"
            printf '  %s\n' "${failed[@]}"
            exit 1
          fi
          echo "All shell tests passed."
