name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # No `cache: pip` — it needs a requirements.txt/pyproject.toml to hash,
          # and this repo has neither (the suite is stdlib-only). With nothing to
          # hash the cache step errors out and the job dies before pytest runs.
          # Add a manifest first if pip caching is ever wanted.
      - name: Install pytest
        run: python3 -m pip install --upgrade pip pytest
      - name: Run Python tests
        run: python3 -m pytest tests/ -v

      # pytest collects Python tests only, so every tests/*.sh suite used to be
      # invisible to CI (issue #32). This step runs them and fails the job if any
      # fail. `!cancelled()` so a pytest failure does not hide the shell results —
      # you want both reports from one run, not one at a time.
      - name: Run shell test suites
        if: ${{ !cancelled() }}
        run: bash scripts/run-shell-suites.sh
