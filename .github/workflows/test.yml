name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pytest
        run: python3 -m pip install --upgrade pip pytest
      - name: Run tests
        run: python3 -m pytest tests/ -v
