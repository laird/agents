name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # No `cache: pip` — it needs a requirements.txt/pyproject.toml to hash,
          # and this repo has neither (the suite is stdlib-only). With nothing to
          # hash the cache step errors out and the job dies before pytest runs.
          # Add a manifest first if pip caching is ever wanted.
      - name: Install pytest
        run: python3 -m pip install --upgrade pip pytest
      - name: Run Python tests
        run: python3 -m pytest tests/ -v

  # pytest's default collection is `test_*.py`, so the 13 tests/test_*.sh files
  # were invisible to CI (issue #32) — which is how #57, #58 and #63 all shipped
  # green. They cover the issue-backend dispatcher, both backends, worker launch
  # and the dev-loop idle path, i.e. most of the autocoder runtime.
  #
  # Kept as a separate job so a shell failure and a python failure stay
  # distinguishable at a glance, and driven through scripts/run-shell-suites.sh
  # so CI and a local run execute the same code path.
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The suite needs a committer identity: three tests build git fixtures
      # that commit, and a bare runner has no global user.name/user.email.
      # Each of those tests sets its own repo-local config, but this guards
      # any future test that forgets to.
      - name: Configure git identity
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
      - name: Run shell test suites
        run: bash scripts/run-shell-suites.sh
